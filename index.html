<!DOCTYPE html>                                                                 <!-- tells the browser this is a html5 document -->
<html lang="eng">                                                               <!-- html starts the HTML document. "eng" tells the browser main language is English; This also helps with search engines, etc -->
<head>                                                                          <!-- head contains info about the webpage, later we'll add things such as page title, SEO description, CSS files, mobile settings etc -->
    <meta name=""viewport" content=""width=device-width, initial-scale="1.0">   <!-- meta tells the browser how to display page on a device -->
    <title>Sept Cascade Hiking | Local Guide in Mauritius</title>               <!-- title is what we see in browser tab -->
    <meta name="description" content="Explore Sept Cascades in Mauritius with a local guide with 15+ years of experience. Choose 3, 4 or 7 waterfalls hike and book your experience">  <!-- meta gives search engines a short description of the website-->
    <link rel="stylesheet" href="css/style.css">                                 <!-- link connects css to html, html creates structure, css controls appearance -->   


</head>

<body>                                                                           <!-- body holds what the vistors will see, the entire website eventually goes there -->

    <script src="js/script.js"></script>                                         <!-- browser reads html from top to bottom. HTML comes first, then javascript loads-->
</body>
